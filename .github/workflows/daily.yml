name: Daily forecast

# Ingest -> retrain -> forecast -> log for every zone, before the ~12:00 CET
# day-ahead gate (09:15 UTC = 10:15 CET / 11:15 CEST, after the TSOs' day-ahead
# load forecasts are due). This is the only place the model trains: it logs each
# zone's forecast and 80% range to Postgres, and the read-only API on Vercel
# serves them. Vercel itself deploys from Git; nothing is uploaded from here.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml]"
      - name: Ingest, retrain, forecast, log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python -u -m elvarsel.daily  # -u: stream progress and phase timings live
