name: Daily forecast

# Ingest -> retrain -> forecast -> log for every zone, before the ~12:00 CET
# day-ahead gate. 09:15 UTC is 10:15 CET in winter and 11:15 CEST in summer,
# after the TSOs' day-ahead load forecasts are due (2h before the gate).
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Ingest, retrain, forecast, log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: python -m elvarsel.daily
